name: Build .exe

# Handmatig starten via Actions -> "Build .exe" -> "Run workflow",
# of automatisch bij een versietag (git tag v1.0 && git push --tags).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Onderdelen installeren
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: Tests
        run: python -m pytest -q

      - name: Modellen downloaden en zelftest
        run: python -m itcam --self-test

      - name: .exe bouwen
        run: python -m PyInstaller --noconfirm --log-level WARN InstantTransmissionCam.spec

      - name: Zelftest van de .exe
        run: dist\InstantTransmissionCam\InstantTransmissionCam.exe --self-test
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: InstantTransmissionCam
          path: dist/InstantTransmissionCam
          retention-days: 30
